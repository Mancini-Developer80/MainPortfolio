<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EA4335;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#grad1)" opacity="0.15"/>
  
  <!-- Main vertex shape - geometric design -->
  <g transform="translate(50, 50)">
    <!-- Top point -->
    <polygon points="0,-35 12,-8 -12,-8" fill="#4285F4"/>
    
    <!-- Bottom left -->
    <polygon points="-25,20 -8,12 -15,30" fill="#EA4335"/>
    
    <!-- Bottom right -->
    <polygon points="25,20 8,12 15,30" fill="#FBBC04"/>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="8" fill="#34A853"/>
  </g>
</svg>